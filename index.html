<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Evolução Vidros – Gestão</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;--pri:#0a0a96;--y:#ffe600;--bg:#dfe3f5;--panel:#f3f4fa;--card:#fff;--tx:#12123a;--mu:#6f7197;--ln:#e3e5f2;--ok:#16a34a;--bad:#dc2626;--tint:#e6e8ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05051c;--panel:#0e0e36;--card:#1a1a58;--tx:#f1f1ff;--mu:#a3a5d4;--ln:#2d2d78;--tint:#25257a;--ok:#4ade80;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#05051c;--panel:#0e0e36;--card:#1a1a58;--tx:#f1f1ff;--mu:#a3a5d4;--ln:#2d2d78;--tint:#25257a;--ok:#4ade80;--bad:#ff8a80}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(700px 380px at 50% -8%,#c5ccff,transparent),var(--bg);color:var(--tx);font:15px/1.45 "Plus Jakarta Sans","Segoe UI",Arial,sans-serif}
.app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--panel);box-shadow:0 0 60px rgba(10,10,150,.14)}
header{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--panel)}
.lgi{width:42px;height:auto;flex:none}header b{display:block;font-size:16px;font-weight:800;color:var(--pri);line-height:1.1}header small{color:var(--mu);font-size:12px}
@media (prefers-color-scheme:dark){header b{color:var(--y)}}
.dt{margin-left:auto;background:var(--card);border-radius:20px;padding:7px 13px;font-weight:600;font-size:12px;text-transform:capitalize}
main{padding:6px 16px 120px}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.4px}.sub{color:var(--mu);margin:2px 0 14px;font-size:14px}
.top .btn{width:100%;margin-bottom:14px}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px}.card h3{margin:0;font-size:17px;font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:8px}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kp .k:first-child,.kp:not(.k3) .k:last-child{grid-column:1/-1}
.k{background:var(--card);border-radius:20px;padding:16px;position:relative}.k h4{margin:0;font-weight:500;font-size:14px}.k b{display:block;font-size:24px;font-weight:700;margin:8px 0 4px;letter-spacing:-.4px}.k small{color:var(--mu);font-size:12px}
.k.pri{color:#fff;background:radial-gradient(circle at 90% 0,#3d3df2,transparent 50%),linear-gradient(145deg,#0a0a96,#050560)}.k.pri small{color:#c9caff}.k.pri b{font-size:30px}
.ar{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--pri);display:grid;place-items:center}
.wel{position:relative;overflow:hidden;border-radius:24px;padding:20px;margin-bottom:14px;color:#fff;display:flex;align-items:center;justify-content:space-between;background:radial-gradient(circle at 70% 0,#3b3bf0,transparent 55%),linear-gradient(135deg,#1a0fb8,#0a0a96 55%,#06066b)}
.wel::before{content:"";position:absolute;right:56px;top:-70px;width:40px;height:300px;background:linear-gradient(#ffe600,#f5b400);transform:rotate(40deg)}
.wel h1{color:#fff;font-size:24px;position:relative;z-index:1}.wel p{margin:3px 0 0;color:#d3d4ff;font-size:14px;position:relative;z-index:1}.wl{width:64px;height:auto;position:relative;z-index:2}
.bars{display:flex;align-items:flex-end;gap:8px;height:170px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:12px;color:var(--mu);gap:6px;position:relative}
.bar div{width:100%;border-radius:30px;background:repeating-linear-gradient(135deg,var(--ln) 0 2px,transparent 2px 7px);border:1px solid var(--ln)}
.bar.on div{background:linear-gradient(180deg,#2323d6,#07075f);border:0}.bar.cur div{background:linear-gradient(180deg,#ffe600,#ffb800);border:0}
.bar em{font-style:normal;position:absolute;top:-2px;font-size:10px;background:var(--tint);color:var(--pri);border-radius:8px;padding:1px 6px;font-weight:700}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.dn{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;flex:none}
.dn div{width:104px;height:104px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--mu)}.dn b{display:block;font-size:24px;color:var(--tx);line-height:1;margin:0}
.lgd div{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.lgd s{width:10px;height:10px;border-radius:3px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);flex-wrap:wrap}.row:last-child{border:0}.row .g{flex:1;min-width:0}.row small{display:block;color:var(--mu);font-size:12px}
.av{width:40px;height:40px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:700;flex:none}
.pill{display:inline-block;border-radius:8px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;background:#fff6bf;color:#8a6d00;border:1px solid #f1df74}
.p0{background:#eef0f8;color:#5b5e85;border-color:#dfe2f0}.p1{background:#e6e8ff;color:#0a0a96;border-color:#ccd0ff}.p3{background:#dcfce7;color:#15803d;border-color:#a7ecc0}.p4{background:#fee2e2;color:#b91c1c;border-color:#fbbcbc}
.btn{border:0;border-radius:28px;min-height:48px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--pri);color:#fff}
.btn.y{background:var(--y);color:#14143a}.btn.o{background:transparent;color:var(--tx);border:1.5px solid var(--ln)}.btn.g{background:var(--panel);color:var(--tx)}.btn.s{min-height:40px;padding:8px 16px;font-size:13px}
.lk{background:none;border:0;color:var(--bad);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:10px 6px}
input,select,textarea{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--ln);border-radius:14px;background:var(--card);color:var(--tx);font:inherit;font-size:16px;margin-top:4px}
select.st{width:auto;min-height:0;margin:0;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:600}
label{font-size:13px;color:var(--mu);display:block;font-weight:600}.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f .w{grid-column:1/-1}
.chips{display:flex;gap:8px;overflow-x:auto;margin:12px -4px 0;padding:0 4px 4px;scrollbar-width:none}.chip{flex:none;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:30px;padding:9px 16px;font:inherit;font-size:13px;font-weight:600}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.calw{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dw{text-align:center;font-weight:700;font-size:12px;color:var(--mu);padding:4px}
.d{aspect-ratio:1;border:1px solid transparent;border-radius:13px;background:rgba(22,163,74,.14);color:var(--tx);font:inherit;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:15px;padding:0}
.d small{display:none}.d.b{background:var(--card);border-color:#9da1ff}.d.b::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--pri)}
.d.p{opacity:.45}.d.o{visibility:hidden}.d.t{box-shadow:inset 0 -4px 0 var(--y)}.d.s{background:var(--pri);color:#fff;border-color:var(--pri)}.d.s::after{background:#fff}
.hero{border-radius:22px;padding:20px;color:#fff;background:radial-gradient(circle at 90% 20%,#3d3df2,transparent 55%),linear-gradient(145deg,#0a0a96,#050560);margin-bottom:14px}.hero h3{font-size:18px;margin:0 0 4px}.hero p{margin:0 0 14px;color:#c9caff;font-size:13px}
.pg{display:grid;gap:14px}.oc{background:var(--card);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:14px}
.oh{display:flex;gap:12px;align-items:center}.oh .g{flex:1;min-width:0}.oh b{font-size:16px;display:block}.oh small{color:var(--mu);font-size:12px}.oi{color:var(--mu);font-size:14px;line-height:1.55}
.mn{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mn div{background:var(--panel);border-radius:14px;padding:10px}.mn small{display:block;color:var(--mu);font-size:11px;margin-bottom:2px}.mn b{font-size:14px}.mn .ok b{color:var(--ok)}.mn .bd b{color:var(--bad)}
.pr2{height:8px;background:var(--ln);border-radius:8px;overflow:hidden}.pr2 div{height:100%;background:var(--ok);border-radius:8px}
.hist{border-top:1px solid var(--ln);padding-top:10px;font-size:13px}.hist>small{display:block;font-weight:700;color:var(--tx);margin-bottom:2px}.hist div{display:flex;justify-content:space-between;align-items:center;padding:5px 0;color:var(--mu)}
.ac{display:flex;gap:10px;align-items:center}.ac .btn{flex:1}
.em{color:var(--mu);text-align:center;padding:18px}
#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;z-index:5;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:end;background:var(--card);border-radius:26px 26px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px rgba(10,10,150,.14)}
#nav button[data-v]{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;font-weight:600;padding:6px 0}
#nav i{font-style:normal;font-size:20px}#nav button.on{color:var(--pri)}@media (prefers-color-scheme:dark){#nav button.on{color:var(--y)}}
#nav button.on::after{content:"";width:18px;height:3px;border-radius:3px;background:var(--y);margin-top:2px}
#fab{justify-self:center;width:58px;height:58px;border-radius:50%;border:0;margin-top:-30px;background:linear-gradient(135deg,#ffe600,#f5b400);color:#0a0a96;font-size:32px;font-weight:700;line-height:1;box-shadow:0 8px 20px rgba(245,180,0,.55),0 0 0 5px var(--panel)}
.mo{position:fixed;inset:0;background:rgba(5,5,40,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}.mo.on{display:flex}
.mb{background:var(--card);border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px;max-height:92vh;overflow:auto}.mb h3{margin:0 0 14px;font-size:20px}
.ac3{display:grid;gap:10px}.ac3 .btn{text-align:left;padding-left:22px}
</style>
</head>

  var prox=D.ag.filter(function(a){return a.date>=TD}).sort(function(a,b){return (a.date+(a.time||"")).localeCompare(b.date+(b.time||""))}).slice(0,5);
  var dev=D.ped.filter(function(p){return vend(p)&&p.total-paid(p)>0.009}).sort(function(a,b){return (b.total-paid(b))-(a.total-paid(a))}).slice(0,5);
  var sem=D.ag.filter(function(a){return a.date>=TD&&a.date<=iso(new Date(T.getTime()+6*864e5))}).length;
  var tot=cnt.reduce(function(a,b){return a+b},0),DC=["#0a0a96","#7c8cff","#ffd400","#16a34a","#ef4444"],ac=0,cg=tot?cnt.map(function(c,i){var a=ac;ac+=c/tot*100;return DC[i]+" "+a+"% "+ac+"%"}).join(","):"var(--ln) 0 100%";
  var hj=D.ag.filter(function(a){return a.date==TD}).length;
  $("#m").innerHTML='<div class="wel"><div><h1>'+(T.getHours()<12?"Bom dia":T.getHours()<18?"Boa tarde":"Boa noite")+'!</h1><p>'+(hj?"Hoje você tem "+hj+" compromisso"+(hj>1?"s":"")+" na agenda.":"Hoje sua agenda está livre.")+'</p></div><img class="wl" src="'+$(".lgi").src+'" alt=""></div>'+
  '<div class="kp"><div class="k pri"><span class="ar">↗</span><h4>Faturado no mês</h4><b>'+R(fat)+'</b><small>Pedidos fechados neste mês</small></div><div class="k"><h4>Recebido no mês</h4><b>'+R(rec)+'</b><small>Pagamentos que entraram</small></div><div class="k"><h4>A receber</h4><b>'+R(rc)+'</b><small>Saldo de todos os pedidos</small></div><div class="k"><h4>Compromissos</h4><b>'+sem+'</b><small>Nos próximos 7 dias</small></div></div>'+
  '<div class="two"><div class="card"><div class="hd"><h3>Faturamento mensal</h3></div><div class="bars">'+meses.map(function(m){return'<div class="bar'+(m.v?" on":"")+(m.c?" cur":"")+'"><em style="'+(m.v?"":"display:none")+'">'+(m.v>=1000?Math.round(m.v/100)/10+"k":Math.round(m.v))+'</em><div style="height:'+(m.v?Math.max(m.v/mx*80,12):14)+'%"></div>'+m.n+"</div>"}).join("")+'</div></div>'+
  '<div class="card"><div class="hd"><h3>Pedidos por situação</h3></div><div class="donut"><div class="dn" style="background:conic-gradient('+cg+')"><div><span><b>'+tot+'</b>pedidos</span></div></div><div class="lgd">'+ST.map(function(s,i){return'<div><s style="background:'+DC[i]+'"></s>'+s+" · <b>"+cnt[i]+"</b></div>"}).join("")+"</div></div></div></div>"+
  '<div class="two"><div class="card"><div class="hd"><h3>Próximos compromissos</h3><button class="btn o s" id="ga">Abrir agenda</button></div>'+(prox.length?prox.map(function(a){return'<div class="row">'+av(a.cli)+'<div class="g"><b>'+esc(a.cli)+'</b><small>'+br(a.date)+(a.time?" às "+a.time:"")+'</small></div><span class="pill '+(a.tipo=="Instalação"?"p3":"p1")+'">'+a.tipo+"</span></div>"}).join(""):'<div class="em">Agenda livre. Que tal marcar uma visita?</div>')+'</div>'+
  '<div class="card"><div class="hd"><h3>Clientes que ainda devem</h3></div>'+(dev.length?dev.map(function(p){return'<div class="row">'+av(p.cli)+'<div class="g"><b>'+esc(p.cli)+'</b><small>'+esc(p.item)+'</small></div><span class="pill p4">'+R(p.total-paid(p))+"</span></div>"}).join(""):'<div class="em">Nenhuma pendência. Tudo pago!</div>')+"</div></div>";
  $("#ga").onclick=function(){V="ag";go()};
}
function ag(){
  var ult=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate(),h="";
  ["D","S","T","Q","Q","S","S"].forEach(function(x){h+='<div class="dw">'+x+"</div>"});
  for(var i=0;i<cur.getDay();i++)h+='<div class="d o"></div>';
  for(var d=1;d<=ult;d++){var k=iso(new Date(cur.getFullYear(),cur.getMonth(),d)),c=D.ag.filter(function(a){return a.date==k}).length;
    h+='<button class="d'+(c?" b":"")+(k<TD?" p":"")+(k==TD?" t":"")+(k==sel?" s":"")+'" data-d="'+k+'">'+d+"<small>"+(c?c+" cliente"+(c>1?"s":""):"Livre")+"</small></button>"}
  var L=D.ag.filter(function(a){return a.date==sel}).sort(function(a,b){return (a.time||"99").localeCompare(b.time||"99")});
  var wd=new Date(sel+"T12:00").toLocaleDateString("pt-BR",{weekday:"long"});
  $("#m").innerHTML='<div class="top"><div><h1>Agenda</h1><p class="sub">Veja os dias livres e quem você vai atender.</p></div><button class="btn" id="na">+ Agendar cliente</button></div>'+
  '<div class="two"><div class="card"><div class="hd"><button class="btn g s" id="pv">‹</button><h3 style="text-transform:capitalize">'+cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"})+'</h3><button class="btn g s" id="nx">›</button></div><div class="calw">'+h+'</div></div>'+
  '<div><div class="hero"><h3 style="text-transform:capitalize">'+wd+'</h3><p>'+br(sel)+" · "+(L.length?L.length+" compromisso(s)":"dia livre")+'</p><button class="btn y s" id="nb">+ Marcar neste dia</button></div><div class="card">'+
  (L.length?L.map(function(a){return'<div class="row">'+av(a.cli)+'<div class="g"><b>'+esc(a.cli)+'</b> <span class="pill '+(a.tipo=="Instalação"?"p3":"p1")+'">'+a.tipo+(a.time?" · "+a.time:"")+"</span>"+(a.end?"<small>📍 "+esc(a.end)+"</small>":"")+(a.obs?"<small>"+esc(a.obs)+"</small>":"")+'</div><button class="lk" data-x="'+a.id+'">Remover</button></div>'}).join(""):'<div class="em">Nada marcado. Você está livre neste dia.</div>')+"</div></div></div>";
  $("#pv").onclick=function(){cur.setMonth(cur.getMonth()-1);ag()};$("#nx").onclick=function(){cur.setMonth(cur.getMonth()+1);ag()};
  document.querySelectorAll("[data-d]").forEach(function(b){b.onclick=function(){sel=b.dataset.d;ag()}});
  document.querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(){D.ag=D.ag.filter(function(a){return a.id!=b.dataset.x});save();ag()}});
  var nv=function(){modal("Novo compromisso em "+br(sel),cn()+'<div class="f"><label class="w">Cliente<input name="cli" list="dl" required></label><label>Tipo<select name="tipo"><option>Visita</option><option>Instalação</option><option>Medição</option></select></label><label>Hora<input type="time" name="time"></label><label class="w">Endereço<input name="end"></label><label class="w">Observações<input name="obs"></label></div>',function(o){o.id=Date.now();o.date=sel;D.ag.push(o)})};
  $("#na").onclick=nv;$("#nb").onclick=nv;
}
function ped(){
  var L=D.ped.filter(function(p){return(flt=="Todos"||p.st==flt)&&(p.cli+" "+p.item).toLowerCase().indexOf(q.toLowerCase())>-1}).sort(function(a,b){return b.date.localeCompare(a.date)});
  var tt=0,tp=0;D.ped.forEach(function(p){if(vend(p)){tt+=+p.total;tp+=paid(p)}});
  $("#m").innerHTML='<div class="top"><div><h1>Pedidos</h1><p class="sub">Tudo que foi orçado e fechado.</p></div><button class="btn" id="np">+ Novo pedido</button></div>'+
  '<div class="kp k3"><div class="k pri"><span class="ar">↗</span><h4>Total fechado</h4><b>'+R(tt)+'</b><small>Soma dos pedidos</small></div><div class="k"><h4>Já recebido</h4><b>'+R(tp)+'</b><small>Pagamentos confirmados</small></div><div class="k"><h4>A receber</h4><b>'+R(tt-tp)+'</b><small>Ainda falta entrar</small></div></div>'+
  '<div class="card"><input id="q" placeholder="Buscar por cliente ou produto" value="'+esc(q)+'"><div class="chips">'+["Todos"].concat(ST).map(function(s){return'<button class="chip'+(s==flt?" on":"")+'" data-f="'+s+'">'+s+"</button>"}).join("")+"</div></div>"+
  (L.length?'<div class="pg">'+L.map(function(p){var pg=paid(p),pc=Math.min(100,pg/(p.total||1)*100),f=p.total-pg>0.009,pv=p.prev||[];
    return'<div class="oc"><div class="oh">'+av(p.cli)+'<div class="g"><b>'+esc(p.cli)+'</b><small>'+br(p.date)+'</small></div><select class="st pill '+PC[ST.indexOf(p.st)]+'" data-s="'+p.id+'">'+opts(ST,p.st)+'</select></div>'+
    '<div class="oi">'+esc(p.item)+'</div>'+
    '<div class="mn"><div><small>Total</small><b>'+R(p.total)+'</b></div><div class="ok"><small>Pago</small><b>'+R(pg)+'</b></div><div class="'+(f?"bd":"ok")+'"><small>'+(f?"Falta":"Situação")+'</small><b>'+(f?R(p.total-pg):"Quitado ✓")+'</b></div></div>'+
    '<div class="pr2"><div style="width:'+pc+'%"></div></div>'+
    (p.pays.length||pv.length?'<div class="hist"><small>Pagamentos</small>'+p.pays.map(function(x){return'<div><span>'+br(x.d).slice(0,5)+" · "+x.m+'</span><b style="color:var(--ok)">+ '+R(x.v)+"</b></div>"}).join("")+pv.map(function(x,i){return'<div><span>'+br(x.d).slice(0,5)+' · Previsto</span><span>'+R(x.v)+' <button class="lk" style="color:var(--ok)" data-o="'+p.id+'" data-i="'+i+'">recebi</button></span></div>'}).join("")+"</div>":"")+
    '<div class="ac"><button class="btn s" data-p="'+p.id+'">+ Pagamento</button><button class="lk" data-r="'+p.id+'">Excluir</button></div></div>'}).join("")+"</div>":'<div class="card em">Nenhum pedido aqui ainda.</div>');
  $("#q").oninput=function(e){q=e.target.value;ped();var i=$("#q");i.focus();i.setSelectionRange(q.length,q.length)};
  document.querySelectorAll("[data-f]").forEach(function(b){b.onclick=function(){flt=b.dataset.f;ped()}});
  document.querySelectorAll("[data-s]").forEach(function(s){s.onchange=function(){D.ped.forEach(function(p){if(p.id==s.dataset.s)p.st=s.value});save();ped()}});
  document.querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){if(confirm("Excluir este pedido?")){D.ped=D.ped.filter(function(p){return p.id!=b.dataset.r});save();ped()}}});
  document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){modal("Registrar pagamento",'<div class="f"><label>Valor (R$)<input name="v" type="number" step="0.01" min="0" required></label><label>Forma<select name="m">'+opts(ME)+'</select></label><label class="w">Data<input name="d" type="date" value="'+TD+'"></label></div>',function(o){D.ped.forEach(function(p){if(p.id==b.dataset.p)p.pays.push({v:+o.v,m:o.m,d:o.d})})})}});
  document.querySelectorAll("[data-o]").forEach(function(b){b.onclick=function(){D.ped.forEach(function(p){if(p.id==b.dataset.o){var x=p.prev.splice(+b.dataset.i,1)[0];p.pays.push({v:x.v,m:"Parcela",d:TD})}});save();ped()}});
  $("#np").onclick=novoPed;
}
function cli(){
  $("#m").innerHTML='<div class="top"><div><h1>Clientes</h1><p class="sub">'+D.cli.length+' cadastrados</p></div><button class="btn" id="nc">+ Novo cliente</button></div><div class="card">'+
  (D.cli.length?D.cli.map(function(c){var ps=D.ped.filter(function(p){return p.cli==c.nome&&vend(p)}),tt=ps.reduce(function(a,p){return a+ +p.total},0),tel=(c.tel||"").replace(/\D/g,"");
    return'<div class="row">'+av(c.nome)+'<div class="g"><b>'+esc(c.nome)+'</b><small>'+esc(c.tel)+(c.end?" · "+esc(c.end):"")+'</small></div><span class="pill p1">'+ps.length+" pedido(s) · "+R(tt)+"</span>"+(tel?'<a class="btn s" style="text-decoration:none;background:#16a34a" target="_blank" rel="noopener" href="https://wa.me/55'+tel+'">WhatsApp</a>':"")+'<button class="lk" data-c="'+c.id+'">Excluir</button></div>'}).join(""):'<div class="em">Cadastre seus clientes para achá-los rápido na agenda e nos pedidos.</div>')+"</div>";
  document.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){D.cli=D.cli.filter(function(c){return c.id!=b.dataset.c});save();cli()}});
  $("#nc").onclick=function(){modal("Novo cliente",'<div class="f"><label class="w">Nome<input name="nome" required></label><label class="w">Telefone / WhatsApp<input name="tel" type="tel" placeholder="(11) 99999-9999"></label><label class="w">Endereço<input name="end"></label></div>',function(o){o.id=Date.now();D.cli.push(o)})};
}
go();
</script>
</body>
